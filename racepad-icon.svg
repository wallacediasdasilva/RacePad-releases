<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background with rounded corners -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <linearGradient id="carbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a"/>
      <stop offset="50%" style="stop-color:#1f1f1f"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff3b3b"/>
      <stop offset="100%" style="stop-color:#cc0000"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9500"/>
      <stop offset="100%" style="stop-color:#e67e00"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0"/>
      <stop offset="50%" style="stop-color:#888888"/>
      <stop offset="100%" style="stop-color:#555555"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Main rounded background -->
  <rect x="16" y="16" width="480" height="480" rx="80" ry="80" fill="url(#bgGrad)"/>
  
  <!-- Subtle checkered flag pattern (top left) -->
  <g opacity="0.25">
    <rect x="40" y="40" width="28" height="28" fill="#fff"/>
    <rect x="68" y="40" width="28" height="28" fill="#111"/>
    <rect x="96" y="40" width="28" height="28" fill="#fff"/>
    <rect x="124" y="40" width="28" height="28" fill="#111"/>
    <rect x="40" y="68" width="28" height="28" fill="#111"/>
    <rect x="68" y="68" width="28" height="28" fill="#fff"/>
    <rect x="96" y="68" width="28" height="28" fill="#111"/>
    <rect x="124" y="68" width="28" height="28" fill="#fff"/>
    <rect x="40" y="96" width="28" height="28" fill="#fff"/>
    <rect x="68" y="96" width="28" height="28" fill="#111"/>
    <rect x="96" y="96" width="28" height="28" fill="#fff"/>
    <rect x="124" y="96" width="28" height="28" fill="#111"/>
  </g>

  <!-- Speedometer arc (top right) -->
  <path d="M 320 80 A 140 140 0 0 1 460 220" fill="none" stroke="#ff2222" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <path d="M 335 95 A 115 115 0 0 1 445 205" fill="none" stroke="#ff4444" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Main button box body -->
  <rect x="96" y="130" width="320" height="300" rx="28" ry="28" fill="url(#carbon)" stroke="#444" stroke-width="6" filter="url(#shadow)"/>
  
  <!-- Inner bevel -->
  <rect x="108" y="142" width="296" height="276" rx="20" ry="20" fill="none" stroke="#333" stroke-width="3"/>

  <!-- Top row: 4 illuminated buttons -->
  <!-- Button 1 - Red -->
  <circle cx="160" cy="190" r="28" fill="url(#redGlow)" stroke="#ff6666" stroke-width="3"/>
  <circle cx="160" cy="190" r="18" fill="#ff1a1a"/>
  <circle cx="154" cy="184" r="6" fill="#ffaaaa" opacity="0.6"/>
  
  <!-- Button 2 - Orange -->
  <circle cx="230" cy="190" r="28" fill="url(#orangeGlow)" stroke="#ffaa44" stroke-width="3"/>
  <circle cx="230" cy="190" r="18" fill="#ff8800"/>
  <circle cx="224" cy="184" r="6" fill="#ffcc88" opacity="0.6"/>
  
  <!-- Button 3 - Red -->
  <circle cx="300" cy="190" r="28" fill="url(#redGlow)" stroke="#ff6666" stroke-width="3"/>
  <circle cx="300" cy="190" r="18" fill="#ff1a1a"/>
  <circle cx="294" cy="184" r="6" fill="#ffaaaa" opacity="0.6"/>
  
  <!-- Button 4 - Orange -->
  <circle cx="370" cy="190" r="28" fill="url(#orangeGlow)" stroke="#ffaa44" stroke-width="3"/>
  <circle cx="370" cy="190" r="18" fill="#ff8800"/>
  <circle cx="364" cy="184" r="6" fill="#ffcc88" opacity="0.6"/>

  <!-- Middle row: 3 rotary knobs -->
  <!-- Knob 1 -->
  <circle cx="175" cy="280" r="36" fill="#222" stroke="#555" stroke-width="4"/>
  <circle cx="175" cy="280" r="28" fill="url(#metal)"/>
  <circle cx="175" cy="280" r="10" fill="#111"/>
  <line x1="175" y1="252" x2="175" y2="268" stroke="#ff3333" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Knob 2 (center, larger) -->
  <circle cx="265" cy="280" r="42" fill="#222" stroke="#555" stroke-width="4"/>
  <circle cx="265" cy="280" r="34" fill="url(#metal)"/>
  <circle cx="265" cy="280" r="12" fill="#111"/>
  <line x1="265" y1="246" x2="265" y2="266" stroke="#ff3333" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Knob 3 -->
  <circle cx="355" cy="280" r="36" fill="#222" stroke="#555" stroke-width="4"/>
  <circle cx="355" cy="280" r="28" fill="url(#metal)"/>
  <circle cx="355" cy="280" r="10" fill="#111"/>
  <line x1="355" y1="252" x2="355" y2="268" stroke="#ff3333" stroke-width="4" stroke-linecap="round"/>

  <!-- Bottom section: toggles and small buttons -->
  <!-- Left toggle switch -->
  <rect x="140" y="350" width="24" height="48" rx="6" fill="#333" stroke="#555" stroke-width="2"/>
  <rect x="144" y="354" width="16" height="20" rx="3" fill="#aaa"/>
  
  <!-- Small red button -->
  <circle cx="200" cy="374" r="16" fill="url(#redGlow)" stroke="#ff5555" stroke-width="2"/>
  <circle cx="200" cy="374" r="10" fill="#ee1111"/>
  
  <!-- Small orange button -->
  <circle cx="250" cy="374" r="16" fill="url(#orangeGlow)" stroke="#ff9944" stroke-width="2"/>
  <circle cx="250" cy="374" r="10" fill="#ff7700"/>
  
  <!-- Right toggle switch -->
  <rect x="290" y="350" width="24" height="48" rx="6" fill="#333" stroke="#555" stroke-width="2"/>
  <rect x="294" y="378" width="16" height="16" rx="3" fill="#aaa"/>
  
  <!-- Three small bottom toggles -->
  <rect x="160" y="420" width="18" height="28" rx="4" fill="#333" stroke="#555" stroke-width="1.5"/>
  <rect x="163" y="423" width="12" height="12" rx="2" fill="#ccc"/>
  
  <rect x="210" y="420" width="18" height="28" rx="4" fill="#333" stroke="#555" stroke-width="1.5"/>
  <rect x="213" y="434" width="12" height="10" rx="2" fill="#ccc"/>
  
  <rect x="260" y="420" width="18" height="28" rx="4" fill="#333" stroke="#555" stroke-width="1.5"/>
  <rect x="263" y="423" width="12" height="12" rx="2" fill="#ccc"/>

  <!-- Red accent line at bottom of box -->
  <rect x="120" y="410" width="272" height="4" rx="2" fill="#cc0000" opacity="0.8"/>
</svg>
